<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 정산 검수</title>
<style>:root{font-family:system-ui,sans-serif;color:#18212f;background:#f4f6f9}body{max-width:1100px;margin:auto;padding:40px 20px}.panel{background:#fff;border:1px solid #dde3ea;border-radius:14px;padding:20px;margin:20px 0}.summary{display:flex;gap:12px;flex-wrap:wrap}.summary span{background:#edf3ff;padding:10px 14px;border-radius:9px}button{background:#1769e0;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.actions{display:flex;gap:5px;flex-wrap:wrap}.actions button{padding:6px 8px;font-size:12px}.actions button:nth-child(2){background:#b54708}.actions button:nth-child(3){background:#637083}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #e7ebef;vertical-align:top}.ok{color:#18794e}.warn,.error{color:#b54708}.muted{color:#637083;font-size:14px}.actions+.muted,td:nth-child(3)>.muted{display:inline-block;margin-top:6px}ul{margin:6px 0;padding-left:20px}@media(max-width:720px){table,thead,tbody,tr,th,td{display:block}thead{display:none}}</style></head>
<body><h1>AI 정산 검수</h1><p class="muted">판정은 Java 규칙이 수행하고, AI는 확인 내용을 설명합니다.</p>
<form id="upload" class="panel"><input name="file" type="file" accept=".csv,text/csv" required> <button>CSV 검수</button><p id="message" class="muted">필수 열: transactionId, transactionDate, merchant, amount, receiptNumber</p></form>
<section id="result" hidden><div id="summary" class="panel summary"></div><div class="panel"><table><thead><tr><th>거래</th><th>판정</th><th>설명 / 확인 항목</th><th>제안</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<script>
const form=document.querySelector('#upload'),message=document.querySelector('#message'),result=document.querySelector('#result'),esc=v=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
form.addEventListener('submit',async e=>{e.preventDefault();const button=form.querySelector('button');button.disabled=true;message.textContent='검수 중입니다…';message.className='muted';try{const response=await fetch('/api/reviews/upload',{method:'POST',body:new FormData(form)}),body=await response.json();if(!response.ok)throw new Error(body.message||'검수 요청에 실패했습니다.');const flagged=body.filter(x=>x.violations.length).length;document.querySelector('#summary').innerHTML=`<span>전체 <b>${body.length}</b>건</span><span>정상 <b>${body.length-flagged}</b>건</span><span>확인 필요 <b>${flagged}</b>건</span>`;document.querySelector('#rows').innerHTML=body.map(x=>`<tr><td><b>${esc(x.transaction.transactionId)}</b><br><span class="muted">${esc(x.transaction.merchant)} · ${Number(x.transaction.amount).toLocaleString()}원</span></td><td class="${x.violations.length?'warn':'ok'}">${x.violations.length?x.violations.map(v=>esc(v.ruleCode)).join('<br>'):'정상'}</td><td>${esc(x.explanation.summary)}${x.explanation.checkPoints.length?`<ul>${x.explanation.checkPoints.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`:''}<br><span class="muted">${x.explanation.available?'AI 설명':'기본 설명'}</span></td><td><div class="actions" data-id="${esc(x.transaction.transactionId)}"><button data-status="APPROVE">정상 처리</button><button data-status="RECHECK">재확인</button><button data-status="HOLD">보류</button></div><span class="muted">AI 제안: ${esc(x.explanation.suggestedAction)}</span></td></tr>`).join('');result.hidden=false;message.textContent='검수가 완료됐습니다.'}catch(error){result.hidden=true;message.textContent=error.message;message.className='error'}finally{button.disabled=false}});
document.querySelector('#rows').addEventListener('click',async e=>{if(!e.target.dataset.status)return;const actions=e.target.closest('.actions'),response=await fetch(`/api/reviews/${encodeURIComponent(actions.dataset.id)}/decisions`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:e.target.dataset.status})});if(response.ok){actions.innerHTML=`<b class="ok">${esc(e.target.textContent)} 완료</b>`}else{message.textContent='처리 상태 저장에 실패했습니다.';message.className='error'}});
</script></body></html>
